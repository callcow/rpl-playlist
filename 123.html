<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест плеера через прокси</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 { font-size: 18px; font-weight: 500; }
    video {
      width: 100%;
      background: #000;
      border-radius: 8px;
    }
    .info {
      margin-top: 12px;
      font-size: 13px;
      color: #888;
      word-break: break-all;
    }
    .error { color: #ff6b6b; }
    .ok    { color: #51cf66; }
  </style>
</head>
<body>

  <h1>Тест плеера через Cloudflare Worker</h1>

  <video id="player" controls playsinline></video>

  <div class="info" id="info">Загрузка…</div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    (function () {
      // ============ НАСТРОЙКИ ============
      const PROXY_WORKER = "https://stream-proxy-worker.kltsve.workers.dev";
      const STREAM_URL = "https://bl.video.matchtv.ru/media/playlist/free_0be499309f49470e57acc0b4489c1c03/17_1029575/360/5168c90a0feb5477b2c6af0d93310ef5/4943919601.m3u8?type_id=6&sr=26&width=100%25&height=100%25&disable_share=1&live=15&ol=1&bookmaker=1&s=5f04f413c9e22396f2aa85a03f8c221d";
      const STREAM_REFERER = "https://matchtv.ru";
      // ====================================

      const info  = document.getElementById("info");
      const video = document.getElementById("player");

      function toBase64Url(str) {
        return btoa(unescape(encodeURIComponent(str)))
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=/g, "");
      }

      const key = toBase64Url(JSON.stringify({
        directUrl: STREAM_URL,
        referer: STREAM_REFERER,
        origin: STREAM_REFERER
      }));

      const proxiedUrl = PROXY_WORKER + "/stream/" + key;

      info.innerHTML =
        "Воркер: <b>" + PROXY_WORKER + "</b><br>" +
        "Прокси URL: " + proxiedUrl;

      // Проверяем, что воркер вообще отвечает
      fetch(PROXY_WORKER + "/", { method: "GET" })
        .then(function (r) {
          info.innerHTML += "<br><span class='ok'>Воркер отвечает, статус: " + r.status + "</span>";
        })
        .catch(function (e) {
          info.innerHTML += "<br><span class='error'>Воркер недоступен: " + e.message + "</span>";
        });

      if (window.Hls && Hls.isSupported()) {
        const hls = new Hls({ debug: false });

        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          info.innerHTML += "<br><span class='ok'>Плейлист загружен, запускаю воспроизведение…</span>";
          video.play().catch(function (e) {
            info.innerHTML += "<br><span class='error'>Автоплей заблокирован: " + e.message + "</span>";
          });
        });

        hls.on(Hls.Events.ERROR, function (event, data) {
          console.error("HLS error:", data);
          info.innerHTML += "<br><span class='error'>HLS error: " + data.type +
                            " / " + data.details + " (fatal: " + data.fatal + ")</span>";
        });

        hls.loadSource(proxiedUrl);
        hls.attachMedia(video);
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = proxiedUrl;
        info.innerHTML += "<br>Использую нативный HLS (Safari)";
      } else {
        info.innerHTML += "<br><span class='error'>HLS не поддерживается браузером</span>";
      }
    })();
  </script>

</body>
</html>
